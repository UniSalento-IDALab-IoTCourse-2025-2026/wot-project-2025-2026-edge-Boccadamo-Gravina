services:

  smartbox-emulator1:
    build: .
    container_name: smartbox_emulator1
    environment:
      - MQTT_BROKER=mqtt-broker
      - MQTT_PORT=1883
      - MQTT_USERNAME=${MQTT_EDGE_DEVICE_USER}
      - MQTT_PASSWORD=${MQTT_EDGE_DEVICE_PASS}
      - MQTT_TOPIC=telemetry/air_quality
      - MQTT_TOPIC_STATUS=telemetry/status
      - DEVICE_ID=smartbox-001
      - DEBUG_DELTA_MEAN=0
      - INTERVAL_SECONDS=4  # Frequenza veloce per testare
    networks:
      - iot-network
    restart: on-failure

  smartbox-emulator2:
    build: .
    container_name: smartbox_emulator2
    environment:
      - MQTT_BROKER=mqtt-broker
      - MQTT_PORT=1883
      - MQTT_USERNAME=${MQTT_EDGE_DEVICE_USER}
      - MQTT_PASSWORD=${MQTT_EDGE_DEVICE_PASS}
      - MQTT_TOPIC=telemetry/air_quality
      - MQTT_TOPIC_STATUS=telemetry/status
      - DEVICE_ID=smartbox-002
      - DEBUG_DELTA_MEAN=-2
      - INTERVAL_SECONDS=4  # Frequenza veloce per testare
    networks:
      - iot-network
    restart: on-failure

  smartbox-emulator3:
    build: .
    container_name: smartbox_emulator3
    environment:
      - MQTT_BROKER=mqtt-broker
      - MQTT_PORT=1883
      - MQTT_USERNAME=${MQTT_EDGE_DEVICE_USER}
      - MQTT_PASSWORD=${MQTT_EDGE_DEVICE_PASS}
      - MQTT_TOPIC=telemetry/air_quality
      - MQTT_TOPIC_STATUS=telemetry/status
      - DEVICE_ID=smartbox-003
      - DEBUG_DELTA_MEAN=10
      - INTERVAL_SECONDS=4  # Frequenza veloce per testare
    networks:
      - iot-network
    restart: on-failure

networks:
  iot-network:
    external: true
